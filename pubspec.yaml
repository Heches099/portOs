name: auto_port
description: Modern port operations dashboard
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  intl: ^0.20.3
  provider: ^6.1.2
  video_player: ^2.9.2
  firebase_auth: ^6.6.0
  firebase_core: ^4.14.0
  camera: ^0.12.0+1
  battery_plus: ^7.1.1
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1
  cloud_firestore: ^6.9.0
  firebase_ai: ^4.0.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env.local
